[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "26.11.7"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
repository = "https://github.com/coderscantina/shot-studio"

[workspace.dependencies]
# gpui-component 0.9.0 depends on the gpui-pre snapshots on crates.io (Zed f816e1f), not on Zed git.
# A git gpui would build a second, incompatible gpui, so both pin to the same exact snapshot.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-component = "=0.9.0"
# Newest linebender release train: vello 0.11.0 and parley 0.12.0 share peniko and kurbo.
vello = "=0.11.0"
parley = "=0.12.0"
# KDL v2 parser for the project files. Spans give line-numbered errors, serde is not needed.
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
blake3 = "1.8.7"
# Vendored libgit2 so the app needs no system git. No https or ssh: the board only works on local repos.
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
# Official MCP Rust SDK. The client feature is only enabled for tests.
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = "line-tables-only"
