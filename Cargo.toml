[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "26.11.7"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
repository = "https://github.com/coderscantina/shot-studio"

[workspace.dependencies]
# gpui-component 0.9.0 depends on the gpui-pre snapshots on crates.io (Zed f816e1f), not on Zed git.
# A git gpui would build a second, incompatible gpui, so both pin to the same exact snapshot.
gpui = { package = "gpui-pre", version = "=0.3.11" }
# The macOS platform behind gpui::Application, same snapshot.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.11" }
gpui-component = "=0.9.0"
# Newest linebender release train: vello 0.11.0 and parley 0.12.0 share peniko and kurbo.
vello = "=0.11.0"
parley = "=0.12.0"
# KDL v2 parser for the project files. Spans give line-numbered errors, serde is not needed.
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
blake3 = "1.8.7"
# Vendored libgit2 so the app needs no system git. No https or ssh: the board only works on local repos.
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
thiserror = "2.0.21"
# Apple frameworks through objc2, on the same 0.3.2 train gpui-pre and wgpu-hal use.
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-avf-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
# Only the HAL properties and host time the speaker needs.
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "HostTime", "objc2-core-audio-types"] }
dispatch2 = "0.3.1"
objc2-uniform-type-identifiers = "0.3.2"
objc2-metal = "0.3.2"
objc2-io-surface = "0.3.2"
block2 = "0.6.2"
# AAC encode for export (AudioConverter) and the PCM output settings keys of AVAssetReader.
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "AudioConverter", "objc2-core-audio-types"] }
# Same wgpu as vello 0.11, so only one wgpu is compiled.
wgpu = "30.0.1"
pollster = "0.4.0"
libc = "0.2.191"
tempfile = "3.27.0"
# Official MCP Rust SDK. The client feature is only enabled for tests.
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
# whisper.cpp bindings, Metal backend for large-v3-turbo.
whisper-rs = { version = "0.16.0", features = ["metal"] }
# Small blocking HTTP client for model downloads.
ureq = "3.5.1"
sha2 = "0.11.1"
# Pure Rust AAC in MP4 decode for the mic track. Only the formats we read.
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "aac", "wav", "pcm"] }
# Real FFT for the spectral denoiser, and EBU R128 loudness and true peak for the audio finish.
realfft = "3.5.1"
ebur128 = "0.1.11"

[profile.release]
debug = "line-tables-only"
