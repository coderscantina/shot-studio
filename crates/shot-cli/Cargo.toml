[package]
name = "shot-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
shot-core = { path = "../shot-core" }
shot-board = { path = "../shot-board" }
shot-mcp = { path = "../shot-mcp" }
shot-capture = { path = "../shot-capture" }
shot-analyze = { path = "../shot-analyze" }
shot-ship = { path = "../shot-ship" }
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
shot-render = { path = "../shot-render" }
notify.workspace = true

[[bin]]
name = "shot"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
