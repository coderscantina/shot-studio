[package]
name = "shot-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
shot-core = { path = "../shot-core" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-media = { workspace = true, features = ["objc2-core-audio-types"] }
objc2-core-video = { workspace = true }
objc2-video-toolbox = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-av-foundation = { workspace = true, features = ["objc2-core-media", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { workspace = true }
objc2-screen-capture-kit = { workspace = true }
objc2-avf-audio = { workspace = true }
objc2-core-audio-types = { workspace = true }
dispatch2 = { workspace = true }
block2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
