# cargo-about 0.9.3 config for scripts/licenses.sh: the crates linked into the shipped app on
# Apple Silicon, without the workspace's own crates, dev and build dependencies.
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
accepted = [
    # Preferred first: a crate under "MIT OR Apache-2.0" is listed under MIT.
    "MIT",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
