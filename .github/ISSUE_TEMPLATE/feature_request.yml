name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before you open a request, check the existing issues for duplicates. The briefing sets the scope, so say how your idea fits it.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the problem, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine this working?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other approaches you rejected.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you be willing to help implement this?
      options:
        - "Yes"
        - Maybe, with guidance
        - "No"
    validations:
      required: true
